name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      # format:check is intentionally omitted until the TypeScript migration (Phase 8)
      # runs a single global `prettier --write .` so the noise lands in one PR.
      - name: Verify doc paths (recipes, STRUCTURE)
        run: npm run verify:doc-paths
      - name: Check (typecheck, test, build — matches local check:full)
        run: npm run check:full
