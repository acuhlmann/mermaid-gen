name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Single source of truth with local / Docker — keep .nvmrc in sync.
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format (Prettier)
        run: npm run format:check
      - name: Verify doc paths (recipes, STRUCTURE)
        run: npm run verify:doc-paths
      - name: Check (typecheck, test, build — matches local check:full)
        run: npm run check:full
