# Build the Docker image on GitHub-hosted runners and deploy to Cloud Run.
# Uses Workload Identity Federation (no long-lived JSON keys). One-time GCP setup: docs/deploy/gcp.md
#
# Deploy waits for the CI workflow to succeed on the same commit (workflow_run),
# so a green main push is required before Cloud Run updates. Manual runs use workflow_dispatch.
name: Deploy Cloud Run

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  REGION: us-central1 # pragma: allowlist secret
  AR_REPO: mermaid-gen
  SERVICE_NAME: mermaid-gen-main
  IMAGE_NAME: web-main
  PUBLIC_BASE_URL: https://mermaid-gen-main-464241135431.us-central1.run.app # pragma: allowlist secret

jobs:
  deploy:
    # Skip failed/cancelled CI runs; always allow manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy the commit CI validated (not whatever HEAD is when this job starts).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Verify GCP billing (preflight)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          export GCP_PROJECT_ID="${PROJECT_ID}"
          chmod +x scripts/verify-gcp-billing.sh
          scripts/verify-gcp-billing.sh

      # Sync Artifact Registry retention (keep 10 web-main; delete web-main >14d).
      # Soft: deployer SA may lack repositories.update; policy is still managed in-repo + local deploy.
      - name: Ensure Artifact Registry cleanup policy
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          export GCP_PROJECT_ID="${PROJECT_ID}"
          chmod +x scripts/apply-artifact-registry-cleanup.sh
          scripts/apply-artifact-registry-cleanup.sh --soft

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          # Prefer the CI-validated SHA when triggered via workflow_run.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}"
          docker build --build-arg UI_VARIANT=main-only -t "${IMAGE}:${DEPLOY_SHA}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${DEPLOY_SHA}"
          docker push "${IMAGE}:latest"

      - name: Deploy Cloud Run
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJECT_ID}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${DEPLOY_SHA}"
          ARGS=(
            run deploy "${{ env.SERVICE_NAME }}"
            --project="${PROJECT_ID}"
            --region="${{ env.REGION }}"
            --image="${IMAGE}"
            --platform=managed
            --allow-unauthenticated
            --port=8080
            --min-instances=0
            --max-instances=1
          )
          CLOUD_RUN_SECRETS=()
          if gcloud secrets describe openrouter-api-key --project="${PROJECT_ID}" &>/dev/null; then
            CLOUD_RUN_SECRETS+=("OPENROUTER_API_KEY=openrouter-api-key:latest")
          fi
          if gcloud secrets describe deepseek-api-key --project="${PROJECT_ID}" &>/dev/null; then
            CLOUD_RUN_SECRETS+=("DEEPSEEK_API_KEY=deepseek-api-key:latest")
          fi
          if gcloud secrets describe invite-token-secret --project="${PROJECT_ID}" &>/dev/null; then
            CLOUD_RUN_SECRETS+=("INVITE_TOKEN_SECRET=invite-token-secret:latest")
          fi
          if gcloud secrets describe visitor-badge-secrets --project="${PROJECT_ID}" &>/dev/null; then
            CLOUD_RUN_SECRETS+=("VISITOR_BADGE_SECRETS=visitor-badge-secrets:latest")
          fi
          if ((${#CLOUD_RUN_SECRETS[@]} > 0)); then
            ARGS+=(--set-secrets="$(IFS=,; echo "${CLOUD_RUN_SECRETS[*]}")")
          fi
          VL="${VERTEX_LOCATION:-us-central1}"  # pragma: allowlist secret
          VF="${VERTEX_MODEL_FAST:-gemini-2.5-flash}"
          VQ="${VERTEX_MODEL_QUALITY:-gemini-2.5-pro}"
          VP="${VERTEX_PROJECT_ID:-${PROJECT_ID}}"
          VEV="VERTEX_LOCATION=${VL},VERTEX_MODEL_FAST=${VF},VERTEX_MODEL_QUALITY=${VQ},VERTEX_PROJECT_ID=${VP},PUBLIC_BASE_URL=${{ env.PUBLIC_BASE_URL }}"
          if [[ -n "${LLM_PROVIDER:-}" ]]; then VEV="${VEV},LLM_PROVIDER=${LLM_PROVIDER}"; fi
          if [[ -n "${OPENROUTER_PREFERRED:-}" ]]; then VEV="${VEV},OPENROUTER_PREFERRED=${OPENROUTER_PREFERRED}"; fi
          ARGS+=(--set-env-vars="${VEV}")
          gcloud "${ARGS[@]}"
